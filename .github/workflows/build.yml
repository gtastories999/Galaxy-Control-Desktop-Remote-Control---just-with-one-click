name: Build Galaxy Control
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/GalaxyControl.Relay -c Release
      - run: pip install websockets==15.0.1
      - run: python3 tests/relay.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/GalaxyControl -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Control-Windows-x64
          path: artifacts/windows/
