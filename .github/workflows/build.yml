name: Build Galaxy Control
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  supabase-and-p2p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/DirectoryClient -c Release
      - run: dotnet run --project tests/Provisioning -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:setup
      - run: node tests/account-broker.cjs
      - run: npm run test:database
      - run: npx playwright install --with-deps chromium
      - run: npm test
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/GalaxyControl -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows
      - name: Verify public build has no operator project
        shell: pwsh
        run: |
          $config = Get-Content artifacts/windows/connection.json -Raw | ConvertFrom-Json
          if ($config.SupabaseUrl -ne 'https://YOUR-PROJECT.supabase.co') { throw 'Public build contains an operator project URL.' }
          if ($config.SupabasePublishableKey -ne 'YOUR_SUPABASE_PUBLISHABLE_KEY') { throw 'Public build contains an operator API key.' }
          if (Test-Path artifacts/windows/connection.local.json) { throw 'Local configuration was included in the public artifact.' }
          $provider = Get-Content artifacts/windows/setup-provider.json -Raw | ConvertFrom-Json
          if ($provider.BrokerUrl -ne '') { throw 'Generic build must not use any developer OAuth backend.' }
          if (@($provider.PSObject.Properties).Count -ne 1) { throw 'Provider config may contain only its public broker URL.' }
          if (Test-Path artifacts/windows/setup-provider.local.json) { throw 'Private distributor configuration was included.' }
      - name: Verify independent developer build configuration
        shell: pwsh
        run: |
          $localProvider = 'src/GalaxyControl/setup-provider.local.json'
          try {
            '{"BrokerUrl":"https://publisher.example.invalid/oauth/"}' | Set-Content $localProvider
            dotnet publish src/GalaxyControl -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/provider-check
            if ($LASTEXITCODE -ne 0) { throw 'Developer build failed.' }
            $configured = Get-Content artifacts/provider-check/setup-provider.json -Raw | ConvertFrom-Json
            if ($configured.BrokerUrl -ne 'https://publisher.example.invalid/oauth/') { throw 'Developer endpoint was not applied.' }
            if (@($configured.PSObject.Properties).Count -ne 1) { throw 'Only a public broker URL may be shipped.' }
            if (Test-Path artifacts/provider-check/setup-provider.local.json) { throw 'Local source filename leaked into output.' }
          } finally {
            Remove-Item $localProvider -ErrorAction SilentlyContinue
          }
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $runtimePaths = @(
            "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe",
            "$env:ProgramFiles/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe",
            "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe"
          )
          $installed = $runtimePaths | Where-Object { Test-Path $_ }
          if (-not $installed) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:TEMP/WebView2Setup.exe"
            $installer = Start-Process "$env:TEMP/WebView2Setup.exe" -ArgumentList '/silent','/install' -Wait -PassThru
            Write-Host "WebView2 installer exit code: $($installer.ExitCode)"
          } else {
            Write-Host 'Using the installed WebView2 Runtime.'
          }
      - name: Verify and capture actual Windows interface
        run: dotnet run --project tests/WindowsUi -c Release
      - name: Upload Windows UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Control-Windows-UI
          path: artifacts/ui/
      - name: Test actual Windows WebView2 peer transport
        run: dotnet run --project tests/WindowsTransport -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Control-P2P-Windows-x64
          path: artifacts/windows/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, supabase-and-p2p]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Galaxy-Control-P2P-Windows-x64
          path: windows
      - name: Package public Windows download
        run: cd windows && zip -r ../Galaxy-Control-Windows-x64.zip .
      - name: Publish direct Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "windows-${{ github.run_number }}" Galaxy-Control-Windows-x64.zip --target "${{ github.sha }}" --title "Galaxy Control - Automatic technician onboarding" --notes "Technician login now opens account or project setup directly and checks email confirmation automatically. Configured distributions save public project settings on first launch and reuse them across updates without copying files. Every developer must register their own OAuth application and deploy their own exchange backend; this generic download contains no shared OAuth provider, project or credentials. See supabase/ACCOUNT-CONNECTION.md for the developer setup guide. Existing public connection settings continue to work. Automated provisioning, OAuth, Windows UI, direct P2P and WebView2 tests run before release; a live OAuth setup requires the developer's own integration." --latest
