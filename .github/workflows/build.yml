name: Build Galaxy Control
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  supabase-and-p2p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/DirectoryClient -c Release
      - run: dotnet run --project tests/Provisioning -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:setup
      - run: node tests/account-broker.cjs
      - run: npm run test:database
      - run: npx playwright install --with-deps chromium
      - run: npm test
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/GalaxyControl -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows
      - name: Verify public build has no operator project
        shell: pwsh
        run: |
          $config = Get-Content artifacts/windows/connection.json -Raw | ConvertFrom-Json
          if ($config.SupabaseUrl -ne 'https://YOUR-PROJECT.supabase.co') { throw 'Public build contains an operator project URL.' }
          if ($config.SupabasePublishableKey -ne 'YOUR_SUPABASE_PUBLISHABLE_KEY') { throw 'Public build contains an operator API key.' }
          if (Test-Path artifacts/windows/connection.local.json) { throw 'Local configuration was included in the public artifact.' }
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $runtimePaths = @(
            "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe",
            "$env:ProgramFiles/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe",
            "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe"
          )
          $installed = $runtimePaths | Where-Object { Test-Path $_ }
          if (-not $installed) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:TEMP/WebView2Setup.exe"
            $installer = Start-Process "$env:TEMP/WebView2Setup.exe" -ArgumentList '/silent','/install' -Wait -PassThru
            Write-Host "WebView2 installer exit code: $($installer.ExitCode)"
          } else {
            Write-Host 'Using the installed WebView2 Runtime.'
          }
      - name: Verify and capture actual Windows interface
        run: dotnet run --project tests/WindowsUi -c Release
      - name: Upload Windows UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Control-Windows-UI
          path: artifacts/ui/
      - name: Test actual Windows WebView2 peer transport
        run: dotnet run --project tests/WindowsTransport -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Control-P2P-Windows-x64
          path: artifacts/windows/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, supabase-and-p2p]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Galaxy-Control-P2P-Windows-x64
          path: windows
      - name: Package public Windows download
        run: cd windows && zip -r ../Galaxy-Control-Windows-x64.zip .
      - name: Publish direct Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "windows-${{ github.run_number }}" Galaxy-Control-Windows-x64.zip --target "${{ github.sha }}" --title "Galaxy Control - Windows UI fixes" --notes "Fixes the missing role selector and square button backgrounds. Includes a rendered 3D gold logo, rounded input fields and role-specific help text. Windows UI snapshots, WebView2 P2P transport, directory and database tests pass before publication. This public build contains configuration placeholders: retain your existing connection.json when updating, or configure your own Supabase project using the repository guide." --latest
